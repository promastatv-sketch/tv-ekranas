name: Sukurti APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kompiliuoti
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Paruošti failą
        run: cp app/build/outputs/apk/release/app-release.apk FotoEkranas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FotoEkranas
          path: FotoEkranas.apk

      - name: Paskelbti atsisiuntimui
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Foto ekranas
          files: FotoEkranas.apk
          make_latest: true
