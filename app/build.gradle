plugins {
    id 'com.android.application'
}

android {
    namespace 'lt.fotoekranas.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'lt.fotoekranas.tv'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            storeFile file('fotoekranas.jks')
            storePassword 'fotoekranas'
            keyAlias 'fotoekranas'
            keyPassword 'fotoekranas'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
